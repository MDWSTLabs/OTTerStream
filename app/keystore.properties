# Release signing configuration for OTTerStream
# This file contains the signing configuration for release builds.
#
# To create a keystore for release signing:
# keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias otterstream
#
# Then place the keystore file in: app/release-key.jks
# And update the values below with your keystore details

storeFile=../release-key.jks
storePassword=changeme
keyAlias=otterstream
keyPassword=changeme
